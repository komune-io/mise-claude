<!DOCTYPE html>
<!-- Source for the 1200x630 social/OG card. Render at 1200x630 and screenshot to
     site/landing/og-image.png (see ticket 07). Not shipped; kept for regeneration. -->
<html lang="en"><head><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { position:relative; background:linear-gradient(180deg,#241a3d,#0e1620 62%,#7e4a50);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif; color:#f4ecdd; }
  svg.scene { position:absolute; inset:0; width:100%; height:100%; }
  .content { position:absolute; z-index:2; left:80px; top:150px; }
  .eyebrow { text-transform:uppercase; letter-spacing:.28em; font-size:20px; font-weight:700; color:#8fbf74; }
  .wm { font-size:150px; font-weight:700; letter-spacing:-6px; line-height:1; margin-top:14px; }
  .wm .seed { color:#ff9d5c; }
  .tag { font-size:44px; font-weight:600; letter-spacing:-1px; margin-top:26px; }
  .tag em { font-style:normal; color:#e9a24a; }
  .url { position:absolute; z-index:2; left:82px; bottom:60px; font-family:ui-monospace,Menlo,monospace;
    font-size:22px; color:#c9b39d; }
</style></head><body>
  <svg class="scene" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d5c"/><stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient></defs>
    <g transform="translate(1000,470)">
      <circle r="240" fill="url(#sunG)" opacity=".7"/>
      <g fill="none" stroke="#ffb377" stroke-width="3">
        <circle r="190" opacity=".22"/><circle r="150" opacity=".38"/><circle r="112" opacity=".58"/><circle r="76" opacity=".82"/>
      </g><circle r="50" fill="#ff9d5c"/>
    </g>
    <path d="M-50 540 C 320 500 720 560 1250 520 L1250 630 L-50 630 Z" fill="#b98a5e"/>
    <path d="M-50 588 C 380 560 800 596 1250 576 L1250 630 L-50 630 Z" fill="#8f6440"/>
  </svg>
  <div class="content">
    <div class="eyebrow">rytmyk toolchain</div>
    <div class="wm">chord<span class="seed">.</span></div>
    <div class="tag">Every agent tool, <em>in harmony.</em></div>
  </div>
  <div class="url">chord.rytmyk.ai · docs.chord.rytmyk.ai</div>
</body></html>
