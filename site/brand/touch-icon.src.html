<!DOCTYPE html>
<!-- Source for the 180x180 apple-touch-icon (opaque tile). Render at 180x180,
     screenshot to site/landing/apple-touch-icon.png. Ticket 07. -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  /* fill the viewport so the icon is square at whatever window size we render */
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:radial-gradient(circle at 50% 46%,#2a2140,#12101f);display:grid;place-items:center}
  svg{width:73%;height:73%}
</style></head><body>
  <svg viewBox="0 0 128 128" aria-hidden="true">
    <defs><radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d5c" stop-opacity="1"/><stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient></defs>
    <circle cx="64" cy="64" r="60" fill="url(#g)" opacity=".7"/>
    <g fill="none" stroke="#ff9d5c" stroke-width="3">
      <circle cx="64" cy="64" r="60" opacity=".25"/><circle cx="64" cy="64" r="47" opacity=".40"/>
      <circle cx="64" cy="64" r="35" opacity=".60"/><circle cx="64" cy="64" r="24" opacity=".85"/>
    </g>
    <circle cx="64" cy="64" r="16" fill="#ff9d5c"/>
  </svg>
</body></html>
