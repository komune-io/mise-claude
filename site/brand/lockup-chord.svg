<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 128" width="380" height="128" role="img" aria-label="chord">
  <title>chord — horizontal lockup</title>
  <!-- Wordmark uses currentColor so it inherits the surrounding text color;
       defaults to the dusk ink for standalone use. The sun stays fixed. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d5c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <circle cx="64" cy="64" r="60" fill="url(#glow)" opacity=".7"/>
    <g fill="none" stroke="#ff9d5c" stroke-width="3">
      <circle cx="64" cy="64" r="60" opacity=".25"/><circle cx="64" cy="64" r="47" opacity=".40"/>
      <circle cx="64" cy="64" r="35" opacity=".60"/><circle cx="64" cy="64" r="24" opacity=".85"/>
    </g>
    <circle cx="64" cy="64" r="16" fill="#ff9d5c"/>
  </g>
  <text x="140" y="64" dominant-baseline="central"
        font-family="'Helvetica Neue',Arial,system-ui,sans-serif" font-size="74" font-weight="700"
        letter-spacing="-2" fill="currentColor" style="color:#241a3d">chord<tspan fill="#ff9d5c">.</tspan></text>
</svg>
