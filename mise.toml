# Dev config for local testing.
# Usage:
#   mise plugin link chord ./   # register the bundled mise plugin
#   mise install                # builtin: install tools from [tools] (rust)
#   mise run install            # task below: cargo-install chord locally

[tools]
rust = "latest"

# ── Cargo dev tasks (fast inner loop) ──

[tasks.build]
description = "Build in debug mode"
run = "cargo build"

[tasks."build:release"]
description = "Build optimized release binary"
run = "cargo build --release"

[tasks.install]
description = "cargo-install chord to ~/.cargo/bin from local source (use 'mise run install'; 'mise install' is the builtin tool installer)"
run = "cargo install --path . --locked --force"

[tasks.test]
description = "Run cargo unit + integration tests"
run = "cargo test"

[tasks.run]
description = "Run inspect (default)"
run = "cargo run -- inspect"

[tasks."run:tui"]
description = "Run inspect TUI"
run = "cargo run -- inspect --tui"

[tasks."run:install"]
description = "cargo run -- install (debug build, in-place; see 'install' task for release install)"
run = "cargo run -- install"

[tasks.lint]
description = "Check for warnings"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting"
run = "cargo fmt -- --check"

[tasks.clean]
description = "Remove cargo build artifacts and all test-generated files across samples"
run = """
# Wipe known generated artifacts inside each sample dir. Tracked files
# (.mise.toml, chord.toml, test.sh, README.md, .test-skip) are not in the list.
for sample_dir in $(find sample -name '.mise.toml' -exec dirname {} \\;); do
  echo "Cleaning $sample_dir..."
  (cd "$sample_dir" && rm -rf \\
    .mcp.json \\
    chord.lock \\
    skills-lock.json \\
    node_modules \\
    _bmad-output \\
    docs \\
    openspec \\
    .agents \\
    .claude)
done
cargo clean
"""

# ── End-to-end (slow, container) ──

[tasks.e2e]
description = "Run end-to-end integration tests in Docker"
run = "docker compose -f e2e/compose.yml build && docker compose -f e2e/compose.yml run --rm e2e"

# ── Sample sweeps ──

[tasks."samples:clean"]
description = "Run clean task in all sample modules"
run = """
for dir in $(find sample -name '.mise.toml' -exec dirname {} \\;); do
  echo "Cleaning $dir..."
  (cd "$dir" && MISE_AUTO_INSTALL=false mise run clean || true)
done
"""

[tasks."samples:test"]
description = "Install and test all sample modules"
run = """
for dir in $(find sample -name '.mise.toml' -exec dirname {} \\;); do
  echo "Testing $dir..."
  # `mise install` here is the builtin (provisions [tools] in the sample's
  # .mise.toml), not the `install` task defined above.
  (cd "$dir" && mise run clean && mise install && mise run test || true)
done
"""
